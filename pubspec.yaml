name: sub_sentry
description: SubSentry - Financial Clarity for Subscriptions.
version: 1.0.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI / Assets
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  
  # Utils
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
