name: sub_sentry
description: SubSentry - Financial Clarity for Subscriptions.
version: 1.0.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  sentry_flutter: ^9.13.0
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI / Assets
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.20.2
  
  # Utils
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  permission_handler: ^12.0.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  sentry_dart_plugin: ^3.2.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: sub-sentry
  org: james-young-36

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0F4C5C"
  adaptive_icon_foreground: "assets/icons/app_icon_1024.png"
